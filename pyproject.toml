[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-sentinel-engine"
version = "0.2.0"
description = "Audited primitives for prospective flood-warning research; no validated performance claims"
requires-python = ">=3.12"
readme = "README.md"
# Exact versions used for the recorded environment are in source/requirements.lock.
dependencies = ["numpy", "torch", "scipy", "pyarrow"]

[project.optional-dependencies]
test = ["pytest", "scikit-learn", "pandas"]

[tool.setuptools.packages.find]
where = ["source"]
include = ["flood_sentinel*"]

[tool.setuptools.package-data]
flood_sentinel = ["LICENSE"]

[tool.pytest.ini_options]
pythonpath = [".", "source"]
testpaths = ["source/tests", "tests"]
